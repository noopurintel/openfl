#---------------------------------------------------------------------------
# Workflow to run Task Runner Regression
# Authors - Noopur, Payal Chaurasiya
#---------------------------------------------------------------------------
name: Task Runner Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_run:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout OpenFL repository
      uses: actions/checkout@v4.1.1
      with:
        fetch-depth: 2 # needed for detecting changes
        submodules: "true"
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Run Task Runner Regression
      run: |
        cd openfl/tests/openfl_e2e
        pip install -r requirements.txt
        pytest -v test_suites/test_task_runner.py -s
        echo "Task runner regression test run completed"

    - name: Tar files
      run: tar -cvf result.tar ./tests/openfl_e2e/results

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ always() }}   # collect artifacts regardless of failures
      with:
        name: task_runner_${{ github.run_id }}
        path: result.tar
