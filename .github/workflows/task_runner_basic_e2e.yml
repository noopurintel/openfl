---
# Task Runner E2E tests for bare metal approach

name: Task_Runner_E2E  # Please do not modify the name as it is used in the composite action

on:
  schedule:
    - cron: "0 0 * * *" # Run every day at midnight
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      num_rounds:
        description: "Number of rounds to train"
        required: false
        default: "5"
        type: string
      num_collaborators:
        description: "Number of collaborators"
        required: false
        default: "2"
        type: string

permissions:
  contents: read

# Environment variables common for all the jobs
env:
  NUM_ROUNDS: ${{ inputs.num_rounds || '5' }}
  NUM_COLLABORATORS: ${{ inputs.num_collaborators || '2' }}

jobs:
  test_with_tls:
    name: tr_tls
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout OpenFL repository
        id: checkout_openfl
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 2 # needed for detecting changes
          submodules: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print all labels
        run: |
          echo "Labels: ${{ github.event.pull_request.labels.*.name }}"

      - name: Print labels if workflow_interface label is present
        if: contains(github.event.pull_request.labels.*.name, 'workflow_interface')
        run: |
          echo "Labels: ${{ github.event.pull_request.labels.*.name }}"

      - name: Print labels if workflow_interface label is not present
        if: ! contains(github.event.pull_request.labels.*.name, 'workflow_interface')
        run: |
          echo "Labels: ${{ github.event.pull_request.labels.*.name }}"
